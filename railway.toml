[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
# One-off: drop the old schema, then apply migrations from scratch. Remove after this deploy.
preDeployCommand = ["npx cross-env PAYLOAD_DROP_DATABASE=true payload migrate"]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
